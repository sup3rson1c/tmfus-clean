---
# cPanel Git Version Control deployment.
# When you click "Deploy HEAD Commit" in cPanel, these run on the server.
# DEPLOYPATH is your account's public_html — change it if the account changes.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp -f index.html              $DEPLOYPATH/
    - /bin/cp -f about.html              $DEPLOYPATH/
    - /bin/cp -f contact.html            $DEPLOYPATH/
    - /bin/cp -f funding-estimator.html  $DEPLOYPATH/
    - /bin/cp -f heloc-calculator.html   $DEPLOYPATH/
    - /bin/cp -f sba-loans.html          $DEPLOYPATH/
    - /bin/cp -f mca.html                $DEPLOYPATH/
    - /bin/cp -f 404.html                $DEPLOYPATH/
    - /bin/cp -f .htaccess               $DEPLOYPATH/
    - /bin/cp -Rf assets/.               $DEPLOYPATH/assets/
    # Server-side API. Files are copied individually on purpose: api/config.php
    # holds the Figure credential, lives only on the server, and is not in this
    # repo. Never add a command here that could overwrite or delete it.
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/cp -f api/figure-heloc.php    $DEPLOYPATH/api/
    - /bin/cp -f api/config.example.php  $DEPLOYPATH/api/
