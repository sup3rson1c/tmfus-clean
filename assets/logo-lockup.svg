<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" fill="none" role="img" aria-label="TMF Team — Capital Strategy">
  <defs>
    <linearGradient id="lkAscent" x1="10" y1="40" x2="40" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55c98d"/>
      <stop offset=".55" stop-color="#4bb0d8"/>
      <stop offset="1" stop-color="#4aa5e8"/>
    </linearGradient>
    <linearGradient id="lkPlate" x1="8" y1="8" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4aa5e8" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(4,8)">
    <rect x=".75" y=".75" width="38.5" height="38.5" rx="11" fill="#0f1113"/>
    <rect x=".75" y=".75" width="38.5" height="38.5" rx="11" fill="url(#lkPlate)"
          stroke="rgba(90,200,190,.5)" stroke-width="1.5"/>
    <rect x="9"    y="20"   width="5" height="10"   rx="2.5" fill="url(#lkAscent)" opacity=".55"/>
    <rect x="17.5" y="13.5" width="5" height="16.5" rx="2.5" fill="url(#lkAscent)" opacity=".8"/>
    <rect x="26"   y="8"    width="5" height="22"   rx="2.5" fill="url(#lkAscent)"/>
  </g>

  <!-- wordmark -->
  <text x="58" y="28"
        font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.3" fill="#fafafa">TMF <tspan font-weight="350" fill="#c9c9d1">Team</tspan></text>
  <text x="58.5" y="42"
        font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="8" font-weight="500" letter-spacing="2.1" fill="rgba(255,255,255,.42)">CAPITAL STRATEGY</text>
</svg>
