<script>(function (d) {
  d.classList.add("js");
  var motion = matchMedia("(prefers-reduced-motion: no-preference)").matches;
  if (motion) d.classList.add("motion-ok");
  /* The opening loader is decided here, before first paint, so the page never
     shows for a moment before the cover arrives. ?motion=force is the review
     override film.js also reads; it counts as motion allowed. */
  var q = location.search, forced = /[?&]motion=force\b/.test(q), seen = false;
  try {
    forced = forced || (!/[?&]motion=auto\b/.test(q) && localStorage.getItem("tmf-motion") === "force");
    seen = sessionStorage.getItem("tmf-loader-seen") === "1";
  } catch (e) {}
  if (forced) d.classList.add("motion-forced");
  if (!seen && (motion || forced)) {
    d.classList.add("is-loading");
    /* Failsafe: if loader.js never runs, the cover still lifts. */
    setTimeout(function () {
      if (!d.classList.contains("is-loading")) return;
      d.classList.remove("is-loading");
      dispatchEvent(new Event("tmf:loader-done"));
    }, 4500);
  }
  /* Campaign and attribution capture: keeps utm_source, utm_medium,
     utm_campaign, utm_content and ref / sl in sessionStorage across pages. */
  try {
    var p = new URLSearchParams(location.search);
    var keys = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "ref", "sl", "sl_id", "ref_id"];
    var current = {};
    var found = false;
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], v = p.get(k);
      if (v) { current[k] = v.slice(0, 200); found = true; }
    }
    if (found) {
      var stored = {};
      try { stored = JSON.parse(sessionStorage.getItem("tmf_attribution") || "{}") || {}; } catch (_) {}
      for (var ck in current) { stored[ck] = current[ck]; }
      sessionStorage.setItem("tmf_attribution", JSON.stringify(stored));
      var last = {};
      try { last = JSON.parse(sessionStorage.getItem("tmf_last_touch") || "{}") || {}; } catch (_) {}
      for (var lk in current) { last[lk] = current[lk]; }
      sessionStorage.setItem("tmf_last_touch", JSON.stringify(last));
    }
  } catch (_) {}
})(document.documentElement);</script>
