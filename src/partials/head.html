<link rel="stylesheet" href="/assets/css/site.css">
<script>(function (d) {
  d.classList.add("js");
  var motion = matchMedia("(prefers-reduced-motion: no-preference)").matches;
  if (motion) d.classList.add("motion-ok");
  /* The opening loader is decided here, before first paint, so the page never
     shows for a moment before the cover arrives. ?motion=force is the review
     override film.js also reads; it counts as motion allowed. */
  var q = location.search, forced = /[?&]motion=force\b/.test(q), seen = false;
  try {
    forced = forced || (!/[?&]motion=auto\b/.test(q) && localStorage.getItem("tmf-motion") === "force");
    seen = sessionStorage.getItem("tmf-loader-seen") === "1";
  } catch (e) {}
  if (forced) d.classList.add("motion-forced");
  if (!seen && (motion || forced)) {
    d.classList.add("is-loading");
    /* Failsafe: if loader.js never runs, the cover still lifts. */
    setTimeout(function () {
      if (!d.classList.contains("is-loading")) return;
      d.classList.remove("is-loading");
      dispatchEvent(new Event("tmf:loader-done"));
    }, 4500);
  }
})(document.documentElement);</script>
